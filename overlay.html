<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANF Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent!important;color:#f7f5ff;font-family:Arial,"Malgun Gothic",sans-serif;overflow:hidden}
#board{display:flex;width:100%;gap:22px;background:transparent}.player{position:relative;flex:1;min-width:0;height:145px;background:transparent;padding:4px 5px 0;overflow:hidden}
.head{height:43px;display:flex;align-items:center;gap:10px}.avatar{width:43px;height:43px;flex:0 0 43px;border-radius:4px;object-fit:cover;background:transparent}.ident{min-width:0;flex:1}.name{font-size:26px;line-height:28px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.counts{display:flex;gap:5px;font-size:17px;line-height:20px;font-weight:600;white-space:nowrap}.c0{color:#ff777d}.c1{color:#ffce55}.c2{color:#b6e96d}.c3{color:#51df94}.c4{color:#b3e86b}.c5{color:#ffdb61}.c6{color:#ff858b}.c7{color:#ce8bff}.acc{font-size:19px;font-weight:700;white-space:nowrap;margin-left:auto;padding-left:8px}.target{font-size:21px;color:#d8d8dc;margin-right:3px}
.keys{height:34px;display:flex;align-items:center;gap:4px;margin-top:8px;overflow:hidden;white-space:nowrap}.key{height:29px;min-width:22px;max-width:52px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:1px solid #292633;border-radius:4px;background:rgba(9,8,17,.58);color:#b5b2c0;font-size:11px;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);overflow:hidden}.key.active{background:#f7f7fa;color:#17151e;border-color:#e7e5ee;box-shadow:0 0 5px #ffffff40}.holdrow{height:42px;display:flex;align-items:flex-start;gap:6px;margin-top:2px;padding-left:28%;}.hold{width:21px;height:38px;border-radius:3px;background:linear-gradient(#fff 0%,#f2f2f4 55%,rgba(210,210,218,.1) 100%);opacity:0;box-shadow:0 0 4px #ffffff30}.hold.on{opacity:1}.stale .name,.stale .counts,.stale .acc{opacity:.55}
</style></head><body><main id="board"><section class="player stale" id="cardA"><div class="head"><img class="avatar" id="avatarA" alt=""/><div class="ident"><div class="name" id="nameA">PLAYER A</div><div class="counts"><span class="c0" id="v0A">0</span><span class="c1" id="v1A">0</span><span class="c2" id="v2A">0</span><span class="c3" id="v3A">0</span><span class="c4" id="v4A">0</span><span class="c5" id="v5A">0</span><span class="c6" id="v6A">0</span><span class="c7" id="v7A">M0 O0</span></div></div><div class="acc"><span class="target">◎</span><span id="accA">--.---%</span></div></div><div class="keys" id="keysA"></div><div class="holdrow" id="holdsA"><i class="hold"></i><i class="hold"></i><i class="hold"></i></div></section><section class="player stale" id="cardB"><div class="head"><img class="avatar" id="avatarB" alt=""/><div class="ident"><div class="name" id="nameB">PLAYER B</div><div class="counts"><span class="c0" id="v0B">0</span><span class="c1" id="v1B">0</span><span class="c2" id="v2B">0</span><span class="c3" id="v3B">0</span><span class="c4" id="v4B">0</span><span class="c5" id="v5B">0</span><span class="c6" id="v6B">0</span><span class="c7" id="v7B">M0 O0</span></div></div><div class="acc"><span class="target">◎</span><span id="accB">--.---%</span></div></div><div class="keys" id="keysB"></div><div class="holdrow" id="holdsB"><i class="hold"></i><i class="hold"></i><i class="hold"></i></div></section></main>
<script>
const q=new URLSearchParams(location.search),room=q.get('room')||'anf-test',player=(q.get('player')||'A').toUpperCase()==='B'?'B':'A',base=location.origin,$=id=>document.getElementById(id);
// Each browser source displays only the selected participant (A or B).
document.getElementById('card'+(player==='A'?'B':'A')).remove();
document.getElementById('board').style.cssText='display:flex;width:520px;gap:0;background:transparent';
const defaults=['LCTRL','L⇧','1','2','3','4','5','V','-','END','HOME','=','←','↑','↓'];
function render(slot,p){const s=slot.toUpperCase(),card=$('card'+s);card.classList.toggle('stale',!p||p.stale||!p.ok);if(!p){$('name'+s).textContent='PLAYER '+s;return;}
 $('name'+s).textContent=p.name||'PLAYER '+s;$('acc'+s).textContent=p.ok?Number(p.acc).toFixed(3)+'%':'--.---%';const av=$('avatar'+s);if(av){const url=typeof p.avatarUrl==='string'&&/^https?:\/\//i.test(p.avatarUrl)?p.avatarUrl:'';if(av.src!==url)av.src=url;av.style.display=url?'block':'none';}
 const rc=Array.isArray(p.rawCounts)?p.rawCounts:[];const val=i=>Number(rc[i]||0);['v0','v1','v2','v3','v4','v5','v6'].forEach((id,i)=>$(''+id+s).textContent=val([0,1,2,3,4,5,6][i]).toLocaleString());$('v7'+s).textContent='M'+(val(8)+val(10))+' O'+val(9);
 const cfg=Array.isArray(p.keyConfig)&&p.keyConfig.length?p.keyConfig.slice(0,16):defaults;const pressed=new Set(Array.isArray(p.keys)?p.keys:[]);const row=$('keys'+s);row.replaceChildren();cfg.forEach(k=>{const el=document.createElement('span');el.className='key'+(pressed.has(k)?' active':'');el.textContent=String(k).replace('LeftControl','LCTRL').replace('RightControl','RCTRL').replace('LeftShift','L⇧').replace('RightShift','R⇧').replace('LeftArrow','←').replace('RightArrow','→').replace('UpArrow','↑').replace('DownArrow','↓').replace('Alpha','');el.title=k;row.appendChild(el)});
 const holds=$('holds'+s).children;for(let i=0;i<holds.length;i++)holds[i].classList.toggle('on',pressed.size>i*2);
}
async function tick(){try{const r=await fetch(base+'/api/state?room='+encodeURIComponent(room),{cache:'no-store'});const d=await r.json();render(player,d.players&&d.players[player]);}catch(e){}setTimeout(tick,250)}tick();
</script></body></html>
