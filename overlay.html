<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANF Night Festival Scoreboard</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:Arial,'Malgun Gothic',sans-serif}.wrap{display:flex;gap:12px;width:100%;}.player{flex:1;min-width:0;background:transparent;border:0;border-radius:0;padding:8px 10px;box-shadow:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:24px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot{font-size:13px;opacity:.65}.acc{font-size:46px;font-weight:900;letter-spacing:-1px;margin:5px 0 9px;font-variant-numeric:tabular-nums}.counts{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:700}.counts span{display:block;text-align:center}.counts small{display:block;font-size:10px;opacity:.65;margin-bottom:3px}.perfect{color:#7cff6b}.early{color:#ff7474}.late{color:#67b5ff}.miss{color:#ffb454}.overload{color:#d39aff}.status{font-size:12px;opacity:.65;margin-top:9px}.stale{opacity:.45}.title{font-size:12px;letter-spacing:3px;opacity:.6;margin:0 0 8px 4px}.keyviewer{display:flex;flex-wrap:nowrap;gap:3px;margin-top:8px;max-width:none}.key{height:22px;min-width:22px;padding:0 5px;box-sizing:border-box;border:1px solid rgba(255,255,255,.5);border-radius:4px;background:rgba(15,20,30,.45);color:rgba(255,255,255,.7);font:11px/20px Arial,sans-serif;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.25)}.key.active{background:rgba(255,255,255,.95);color:#111;border-color:#fff;box-shadow:0 0 7px rgba(255,255,255,.5)}
</style></head><body><div class="title">ADOFAI NIGHT FESTIVAL · LIVE SCORE</div><div class="wrap"><section class="player" id="cardA"><div class="top"><div class="name" id="nameA">PLAYER A</div><div class="slot">PLAYER A</div></div><div class="acc" id="accA">--.---%</div><div class="counts"><span class="perfect"><small>PERFECT</small><b id="perfectA">--</b></span><span class="early"><small>EARLY</small><b id="earlyA">--</b></span><span class="late"><small>LATE</small><b id="lateA">--</b></span><span class="miss"><small>MISS</small><b id="missA">--</b></span><span class="overload"><small>OVERLOAD</small><b id="overloadA">--</b></span></div><div class="keyviewer" id="keysA" aria-label="Player A key viewer"></div><div class="status" id="statusA">연결 대기 중</div></section><section class="player" id="cardB"><div class="top"><div class="name" id="nameB">PLAYER B</div><div class="slot">PLAYER B</div></div><div class="acc" id="accB">--.---%</div><div class="counts"><span class="perfect"><small>PERFECT</small><b id="perfectB">--</b></span><span class="early"><small>EARLY</small><b id="earlyB">--</b></span><span class="late"><small>LATE</small><b id="lateB">--</b></span><span class="miss"><small>MISS</small><b id="missB">--</b></span><span class="overload"><small>OVERLOAD</small><b id="overloadB">--</b></span></div><div class="keyviewer" id="keysB" aria-label="Player B key viewer"></div><div class="status" id="statusB">연결 대기 중</div></section></div>
<script>
const q=new URLSearchParams(location.search),room=q.get('room')||'anf-test';const selected=(q.get('player')||'both').toUpperCase();const base=location.origin;const $=id=>document.getElementById(id);
const defaultKeys=['D','F','J','K','Space','LeftShift','RightShift','LeftControl','RightControl','LeftAlt','RightAlt','Q','E','LeftArrow','DownArrow','UpArrow'];const keyLabel=k=>({'Alpha1':'1','Alpha2':'2','Alpha3':'3','Alpha4':'4','Alpha5':'5','Alpha6':'6','Alpha7':'7','Alpha8':'8','Alpha9':'9','Alpha0':'0','LeftShift':'LSH','RightShift':'RSH','LeftControl':'LCTRL','RightControl':'RCTRL','LeftAlt':'LALT','RightAlt':'RALT','Space':'SPACE','Return':'ENTER','Backspace':'BKSP','UpArrow':'↑','DownArrow':'↓','LeftArrow':'←','RightArrow':'→'}[k]||k);const keyEls={};const currentKeys={A:[],B:[]};for(const slot of ['A','B']){const box=$('keys'+slot);for(const k of defaultKeys){const el=document.createElement('div');el.className='key';el.textContent=keyLabel(k);el.dataset.key=k;box.appendChild(el);keyEls[slot+'_'+k]=el;currentKeys[slot].push(k);}}
function setKeys(slot,data){const names=(data&&Array.isArray(data.keyConfig)&&data.keyConfig.length?data.keyConfig:defaultKeys).slice(0,16);if(names.join('|')!==currentKeys[slot].join('|')){currentKeys[slot]=names;const box=$('keys'+slot);box.replaceChildren();for(const k of names){const el=document.createElement('div');el.className='key';el.textContent=keyLabel(k);el.dataset.key=k;box.appendChild(el);keyEls[slot+'_'+k]=el;}}const pressed=new Set(data&&Array.isArray(data.keys)?data.keys:[]);for(const k of currentKeys[slot]){const el=keyEls[slot+'_'+k];if(el)el.classList.toggle('active',pressed.has(k));}}
async function tick(){try{const r=await fetch(base+'/api/state?room='+encodeURIComponent(room),{cache:'no-store'});const d=await r.json();render('A',d.players&&d.players.A);render('B',d.players&&d.players.B);}catch(e){$('statusA').textContent=$('statusB').textContent='서버 연결 중…';}setTimeout(tick,250)}tick();
</script></body></html>
